# TP4 host knob (H3): put the SMMU in passthrough (identity) mode at boot.
#
# WHAT. Appends `iommu.passthrough=1` to the kernel command line. The vendor drop-in
# /etc/default/grub.d/iommu.cfg sets `iommu.passthrough=0` (SMMU translating: the iommu
# groups read DMA / DMA-FQ); with passthrough=1 they read `identity` and DMA from the
# ConnectX-7 fabric NICs (enp1s0f0np0 / enp1s0f1np1, RDMA rocep1s0f0/1) skips SMMU
# translation. Hypothesis H3: less per-descriptor overhead on the switchless ring.
#
# WHY IT WORKS. grub-mkconfig sources every /etc/default/grub.d/*.cfg in lexical order and
# each one only appends to $GRUB_CMDLINE_LINUX; the kernel honours the LAST occurrence of
# iommu.passthrough on the cmdline. This file must therefore be sourced AFTER the vendor's
# iommu.cfg, which is why it is named `zz-`: digits sort BEFORE letters in every locale, so a
# `90-` prefix would have been sourced first and the vendor =0 would have won. The ordering
# is still NOT assumed: `tp4-iommu.sh --apply` regenerates grub.cfg, greps both occurrences
# and reports `unsupported` (exit 3) if the =1 does not end up last.
#
# LIFECYCLE. Installed on the 4 nodes by `scripts/deploy-host.sh` (sudo -n install -m 0644
# into /etc/default/grub.d/); it is INERT until `~/tp4/host/tp4-iommu.sh --apply` runs
# `update-grub`, and only takes effect at the next boot. `tp4-iommu.sh --revert` removes it
# and regenerates grub.cfg; that too needs a reboot. Reboots are owner-driven and manual:
# no script here ever reboots a node. The vendor iommu.cfg is never modified.
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX iommu.passthrough=1"
